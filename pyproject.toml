[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mise-en-space"
version = "0.1.0"
description = "Phone scan to to-scale, editable 3D room: scene backend, layout checks, product import, MCP server and AI design agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "websockets>=12",
  "httpx>=0.27",
  "pillow>=10",
  "beautifulsoup4>=4.12",
  "mcp>=2.0",
]

[project.optional-dependencies]
markers = ["opencv-contrib-python>=4.9"]
poses = ["pycolmap>=3.11", "opencv-python-headless>=4.9"]
eval = ["lpips", "torch"]
dev = ["pytest>=8"]

[project.scripts]
mise = "mise.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
